apiVersion: kubeflow.org/v1
kind: PyTorchJob
metadata:
  name: hubert-pretrain-ram
  namespace: t-hisys-qcheng
spec:
  pytorchReplicaSpecs:
    Master:
      replicas: 1
      restartPolicy: Never
      template:
        metadata:
          annotations:
            roce/gid-injection: '{"envName": "NCCL_IB_GID_INDEX"}'
            sidecar.istio.io/inject: "false"
            k8s.v1.cni.cncf.io/networks: kube-system/rdma0,kube-system/rdma1,kube-system/rdma2,kube-system/rdma3,kube-system/rdma4,kube-system/rdma5,kube-system/rdma6,kube-system/rdma7
          labels:
            scitix.ai/topo-aware-in-node: "true"
        spec: &job-spec # YAML 锚点，方便 Worker 复用
          tolerations:
            - key: "scitix.ai/nodecheck"
              operator: "Exists"
              effect: "NoSchedule"
          containers:
            - name: pytorch
              image: registry-cn-shanghai.siflow.cn/hisys/fairseq-hpc:v1.0
              imagePullPolicy: IfNotPresent
              command:
                - /bin/bash
                - -c
                - |
                  /path/to/your/run_training_from_storage.sh \
                      --wheelhouse "/everything/environment/wheelhouse" \
                      --manifest-dir "/everything/manifests" \
                      --kmeans-dir "/everything/kmeans_model" \
                      --fairseq-repo "/workspace/fairseq" \
                      --restore-file "/everything/models/hubert_xtralarge_ll60k.pt" \
                      --old-base-path "/datasets/processed_output" \
                      --new-base-path "/everything/processed_output" \
                      --python-exec "/opt/conda/bin/python3"
              resources:
                limits:
                  cpu: "80"
                  memory: 800Gi
                  nvidia.com/gpu: "8"
                  nvidia.com/rdma0: "1"
                  nvidia.com/rdma1: "1"
                  nvidia.com/rdma2: "1"
                  nvidia.com/rdma3: "1"
                  nvidia.com/rdma4: "1"
                  nvidia.com/rdma5: "1"
                  nvidia.com/rdma6: "1"
                  nvidia.com/rdma7: "1"
              # 保留安全上下文
              securityContext:
                capabilities:
                  add:
                    - IPC_LOCK
              volumeMounts:
                - mountPath: /dev/shm
                  name: dev-shm
                - mountPath: /workspace/deep_learning_examples
                  name: deep-learning-examples
                - mountPath: /everything
                  name: everything
                - mountPath: /dev/shm/ramdisk
                  name: ramdrisk
          volumes:
            - name: deep-learning-examples
              hostPath:
                path: /tmp/deep_learning_examples
            - name: dev-shm
              hostPath:
                path: /dev/shm
            - name: everything
              hostPath:
                path: /mnt/xstorage
            - name: ramdrisk
              emptyDir:
                medium: Memory
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: roce/topology-unit
                        operator: In
                        values:
                          - "unit1"

    Worker:
      replicas: 15
      restartPolicy: Never
      template:
        metadata:
          annotations:
            roce/gid-injection: '{"envName": "NCCL_IB_GID_INDEX"}'
            sidecar.istio.io/inject: "false"
            k8s.v1.cni.cncf.io/networks: kube-system/rdma0,kube-system/rdma1,kube-system/rdma2,kube-system/rdma3,kube-system/rdma4,kube-system/rdma5,kube-system/rdma6,kube-system/rdma7
          labels:
            scitix.ai/topo-aware-in-node: "true"
        spec:
          # 复用 Master的spec
          <<: *job-spec